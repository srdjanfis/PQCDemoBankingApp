spring.application.name=PQCDemoBankingApp
# Port za HTTPS komunikaciju
server.port=8443

# Omogućavanje SSL/TLS-a
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore-pqc.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-store-provider=BC
server.ssl.key-alias=pqckey
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.3
server.ssl.ciphers=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256

