spring.application.name=PQCDemoBankingApp
# Port za HTTPS komunikaciju
server.port=8443

# PQC-TLS profil: BCJSSE + hibridni ML-KEM-768 key exchange (vidi
# PqcDemoBankingAppApplication.java static blok). Sertifikat je NAMERNO
# klasican (EC/ECDSA) - BCJSSE trenutno ne ume pouzdano da autentifikuje
# TLS 1.3 handshake sertifikatom sa ML-DSA kljucem (poznat, nerešen bug:
# https://github.com/bcgit/bc-java/issues/2102). ML-DSA-65 potpis i dalje
# postoji, samo na nivou aplikacije (PqcSignatureService), ne u TLS sloju.
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore-classic.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=classickey
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.3
server.ssl.ciphers=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256